services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: hackku
      POSTGRES_PASSWORD: hackku
      POSTGRES_DB: hackku_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    restart: unless-stopped
    environment:
      - PG_CONNECTION_STRING=postgres://hackku:hackku@db:5432/hackku_dev
    ports:
      - "4444:4444"
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
      - |
        until timeout 1 bash -c 'cat < /dev/null > /dev/tcp/db/5432' 2>/dev/null; do
          sleep 1
        done
        exec /start.sh

volumes:
  pgdata: